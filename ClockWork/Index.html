<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockWork | The Clock that works for you</title>
    <meta name="description" content="ClockWork is a simple and elegant clock application that helps you keep track of time while you work.">
    <link href="stylesheet.css" rel="stylesheet" type="text/css">
    
</head>
<body>
    <nav>
        <div class="logo">ClockWork</div>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="how it works">How it Works</a>
        </div>
    </nav>

    <div class="app-shell">
        <header class="hero">
            <h1>Welcome to ClockWork</h1>
            <h2>The clock that works so you work</h2>
        </header>

        <div class="clock-container">
            <div class="digital-clock">
                <h1 id="time">00:00:00 AM</h1>
                <p id="date-time">Loading date...</p>
            </div>

            <div class="clock">
                <div class="clock-face">
                    <div class="number number1">1</div>
                    <div class="number number2">2</div>
                    <div class="number number3">3</div>
                    <div class="number number4">4</div>
                    <div class="number number5">5</div>
                    <div class="number number6">6</div>
                    <div class="number number7">7</div>
                    <div class="number number8">8</div>
                    <div class="number number9">9</div>
                    <div class="number number10">10</div>
                    <div class="number number11">11</div>
                    <div class="number number12">12</div>
                    <div class="hand hour-hand" id="hour-hand"></div>
                    <div class="hand minute-hand" id="minute-hand"></div>
                    <div class="hand second-hand" id="second-hand"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="javascript.js" type="text/javascript"></script>
</body>
</html>
